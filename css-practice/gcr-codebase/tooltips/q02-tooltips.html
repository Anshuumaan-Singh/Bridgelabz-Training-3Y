<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Tooltip Demonstration</title><link rel="stylesheet" href="q02-tooltips.css"></head>
<body><main class="page"><header><p class="eyebrow">Hover to discover</p><h1>Little helpful notes</h1><p>Move over an item or focus it with the keyboard to reveal its tooltip.</p></header><section class="tooltip-row" aria-label="Tooltip examples"><button class="tip-target" type="button" data-tip="A quick note about your profile">Profile <span aria-hidden="true">ⓘ</span></button><a class="tip-target" href="#save" data-tip="Your changes are saved locally">Save <span aria-hidden="true">↗</span></a><button class="tip-target" type="button" data-tip="More details are available here">Details <span aria-hidden="true">?</span></button></section><p class="hint">CSS-only tooltips fade in above each item.</p></main></body></html>
