<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>UI Components</title><link rel="stylesheet" href="q07-ui-components.css"></head>
<body><main class="page"><section class="ui-card"><p class="eyebrow">Quick tools</p><h1>Find your next idea</h1><form class="search-form" action="#" method="get"><label class="visually-hidden" for="search">Search ideas</label><input id="search" name="q" type="search" placeholder="Search ideas"><button type="submit">Search</button></form><div class="actions"><button class="primary" type="button">Create a note</button><button class="secondary" type="button">Browse topics</button></div><label for="topic">Choose a topic</label><select id="topic" name="topic"><option value="">Select a topic</option><option>Design</option><option>Technology</option><option>Learning</option></select><p class="hint">Search, choose a topic, or start a new note.</p></section></main></body></html>
