<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Outline and Focus Form</title><link rel="stylesheet" href="q09-outline-form.css"></head>
<body><main class="page"><header><p class="eyebrow">Share a thought</p><h1>Outline &amp; focus</h1><p>Click or tab into a field to see its focus outline.</p></header><form action="#" method="post"><label for="name">Your name</label><input class="solid" id="name" name="name" type="text" placeholder="Name"><label for="email">Email address</label><input class="dashed" id="email" name="email" type="email" placeholder="you@example.com"><label for="message">Message</label><textarea class="dotted" id="message" name="message" rows="5" placeholder="Write your message"></textarea><button type="submit">Send message</button></form></main></body></html>
