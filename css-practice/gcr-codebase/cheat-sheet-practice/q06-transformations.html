<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Transformations</title><link rel="stylesheet" href="q06-transformations.css"></head>
<body><main class="page"><header><p class="eyebrow">Move, turn, reshape</p><h1>CSS transformations</h1><p>Hover over a tile to see its transformation.</p></header><section class="transform-row" aria-label="Transformation examples"><figure><div class="tile rotate">↗</div><figcaption><strong>rotate()</strong><span>Turns the box</span></figcaption></figure><figure><div class="tile scale">↗</div><figcaption><strong>scale()</strong><span>Changes its size</span></figcaption></figure><figure><div class="tile translate">↗</div><figcaption><strong>translate()</strong><span>Moves the box</span></figcaption></figure><figure><div class="tile skew">↗</div><figcaption><strong>skew()</strong><span>Slants the box</span></figcaption></figure></section></main></body></html>
