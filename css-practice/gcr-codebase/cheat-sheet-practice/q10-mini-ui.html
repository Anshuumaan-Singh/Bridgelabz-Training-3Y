<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini User Interface</title><link rel="stylesheet" href="q10-mini-ui.css"></head>
<body><header class="site-header"><a href="#home">Daylight</a><span>Small steps, every day</span></header><main id="home" class="page"><article class="card"><div class="card-image"><img src="https://images.unsplash.com/photo-1499209974431-9dddcece7f88?auto=format&amp;fit=crop&amp;w=800&amp;q=85" alt="Notebook and coffee on a sunny desk"></div><section class="card-content"><p class="eyebrow">A daily note</p><h1>What would you like to remember?</h1><p>Write down one thought from your day.</p><form action="#" method="post"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Anshuman Singh"><label for="note">Your note</label><textarea id="note" name="note" rows="3" placeholder="Today I learned..."></textarea><div class="buttons"><button class="save" type="submit">Save note</button><button class="later" type="button">Maybe later</button></div></form></section></article></main><footer>© 2026 Daylight · GLA University, Mathura</footer></body></html>
