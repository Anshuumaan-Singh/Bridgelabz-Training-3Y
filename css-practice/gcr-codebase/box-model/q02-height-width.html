<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Height and Width Practice</title><link rel="stylesheet" href="q02-height-width.css"></head>
<body><main class="stage"><header><p class="eyebrow">Sizing with CSS</p><h1>Height &amp; width practice</h1><p>These boxes use different units and limits.</p></header><section class="box-row" aria-label="Boxes with different dimensions"><article class="size-box pixel"><h2>Pixel box</h2><p>Width: 180px<br>Height: 140px<br>Text can scroll if it overflows.</p></article><article class="size-box percent"><h2>Flexible box</h2><p>Width: 28%<br>Height: 18vh<br>Max-width: 300px</p></article><article class="size-box em"><h2>Em box</h2><p>Width: 14em<br>Min-height: 10em<br>Overflow: auto</p></article></section></main></body></html>
