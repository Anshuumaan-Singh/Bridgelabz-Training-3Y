<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Styled Button Collection</title><link rel="stylesheet" href="q05-button-collection.css"></head>
<body><main class="page"><header><p class="eyebrow">Button states</p><h1>Choose your action</h1><p>Hover, press, or tab to each button to see its state.</p></header><section class="button-row" aria-label="Button style examples"><button class="btn primary" type="button">Primary action</button><button class="btn secondary" type="button">Secondary</button><button class="btn outline" type="button">Outline style</button><button class="btn disabled" type="button" disabled>Unavailable</button></section><p class="hint">The last button is disabled. Use Tab to see the focus ring.</p></main></body></html>
