<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="task-tracker-badges.css"></head>
<body><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"><div><p class="text-uppercase small fw-bold text-primary mb-1">My workspace</p><h1 class="h2 fw-bold mb-0">Tasks for today</h1></div><span class="badge rounded-pill text-bg-primary fs-6">3 pending</span></header><ul class="list-group shadow-sm"><li class="list-group-item d-flex justify-content-between align-items-center p-3"><span>Review responsive layout notes</span><span class="badge text-bg-danger">High</span></li><li class="list-group-item d-flex justify-content-between align-items-center p-3"><span>Finish portfolio introduction</span><span class="badge text-bg-warning">Medium</span></li><li class="list-group-item d-flex justify-content-between align-items-center p-3"><span>Organize design references</span><span class="badge text-bg-success">Low</span></li></ul><button type="button" class="btn btn-success mt-4">Completed <span class="badge text-bg-light text-success ms-1">1</span></button></div></div></main><footer class="container text-center py-4 text-secondary">A little progress adds up · Anshuman Singh</footer></body></html>
