<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Contact Form</title></head>
<body>
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required><br>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter a subject" required><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message" required></textarea><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
