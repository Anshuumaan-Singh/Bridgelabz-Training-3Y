<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Feedback Form</title></head>
<body>
    <h1>Feedback</h1>
    <form action="#" method="post">
        <label for="feedback">Your feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="40"></textarea><br>
        <p>Rating:</p>
        <input type="radio" id="good" name="rating" value="Good">
        <label for="good">Good</label>
        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label>
        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label><br>
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
