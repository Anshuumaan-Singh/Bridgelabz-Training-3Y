<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Payment Form</title></head>
<body>
    <h1>Payment</h1>
    <form action="#" method="post">
        <label for="cardholder">Cardholder Name:</label>
        <input type="text" id="cardholder" name="cardholder" required><br>
        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number" name="card_number" required><br>
        <label for="expiry">Expiry Date:</label>
        <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required><br>
        <label for="cvv">CVV:</label>
        <input type="password" id="cvv" name="cvv" required><br>
        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
