<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Submit a Form</title></head>
<body>
    <h1>Simple Form</h1>
    <form action="q17-result.html" method="get" target="resultFrame">
        <label for="user-text">Enter text:</label>
        <input type="text" id="user-text" name="text">
        <button type="submit">Submit</button>
    </form>
    <iframe name="resultFrame" title="Form submission result" width="500" height="150"></iframe>
</body>
</html>
