<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Secure Form Attributes</title></head>
<body>
    <h1>Secure Form</h1>
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>
        <button type="submit">Submit</button>
    </form>
    <p>Turning off autocomplete can reduce the chance that sensitive entries are saved or suggested on a shared device. Browser behavior may vary.</p>
</body>
</html>
