<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Student Dashboard</h1>
        <p>Welcome back!</p>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav aria-label="Dashboard navigation">
                <a href="#overview">Overview</a>
                <a href="#courses">Courses</a>
                <a href="#tasks">Tasks</a>
                <a href="#settings">Settings</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <section id="overview" class="content-box">
                <h2>Overview</h2>
                <p>You have completed 72% of your current learning plan.</p>
            </section>

            <section id="courses" class="content-box">
                <h2>Courses</h2>
                <p>Data Structures, Web Development and Database Systems are currently active.</p>
            </section>

            <section id="tasks" class="content-box">
                <h2>Tasks</h2>
                <p>Three assignments are scheduled for completion this week.</p>
            </section>
        </main>
    </div>
</body>
</html>
