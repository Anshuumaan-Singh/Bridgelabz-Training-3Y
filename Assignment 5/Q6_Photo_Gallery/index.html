<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="gallery-page">
        <header>
            <h1>Travel Gallery</h1>
            <p>A CSS-only responsive image gallery.</p>
        </header>

        <section class="gallery" aria-label="Travel photographs">
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape">
                <figcaption>Mountain Escape</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Beach and ocean">
                <figcaption>Ocean View</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Forest path">
                <figcaption>Forest Trail</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80" alt="Green valley">
                <figcaption>Green Valley</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Lake and mountains">
                <figcaption>Peaceful Lake</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80" alt="Snow covered mountain">
                <figcaption>Snowy Peak</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
